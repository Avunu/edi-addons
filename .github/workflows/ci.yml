# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); do not edit.
# The quality gates (odoo-nix docs: standards/ci.md): one caller job per gate, each named
# `ci`, so the checks read `ci / lint` and `ci / test`. odoo-nix's reusable workflows move
# only with the locked odoo-nix (`odoo-init --sync`). The test gate runs the pull request's
# code, so it never gets the CI App's key: private submodules are fetched with
# ci.submodule-app (an App with Contents read only).
name: ci
on:
  push:
    branches: ["18.0"]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: ci
    permissions:
      contents: read
    uses: Avunu/odoo-nix/.github/workflows/odoo-lint.yml@2de0c9e8078f01dcd2ad98829dd4b440cc9c099e # v3.1.0
    with:
      integration-branch: "18.0"
      runs-on: '["self-hosted","nixos"]'
  test:
    name: ci
    permissions:
      contents: read
    uses: Avunu/odoo-nix/.github/workflows/odoo-test.yml@2de0c9e8078f01dcd2ad98829dd4b440cc9c099e # v3.1.0
    with:
      integration-branch: "18.0"
      runs-on: '["self-hosted","nixos"]'
      test-timeout-minutes: 60
